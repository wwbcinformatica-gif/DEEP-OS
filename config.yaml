agent:
  image_input_mode: image
  max_tool_steps: 100
  max_turns: 40
  personality: opencode
  system_prompt: 'Responda Sempre em Portugues

    '
  toolset: agent
display:
  accent_theme: dark
  compact: true
  language: pt-BR
  show_reasoning: true
  show_tool_calls: true
  streaming: true
security:
  sandbox_enabled: false
server:
  hostname: 0.0.0.0
  port: 8000
spiral_memory:
  enabled: true
  interval: 6
  keeper_model: qwen2.5-coder:7b
  keeper_provider: ollama
terminal:
  allowed_commands:
  - ls
  - dir
  - cat
  - type
  - echo
  - pwd
  - cd
  - mkdir
  - copy
  - move
  - del
  - git
  - npm
  - node
  - python
  - pip
  - curl
  - find
  - grep
  - rg
  - ollama
  backend: powershell
  cwd: .
  timeout: 600
voice:
  auto_send: true
  auto_send_delay: 10
  deep_mode_active: false
  elevenlabs_voices: true
  hybrid_mode: true
  hybrid_voice: charon
  jarvis_pitch: -15Hz
  jarvis_rate: -5%
  mic_active_on_start: false
  tts_enabled: true
  voice_pitch: -15Hz
  voice_preset: dani-brandi
  voice_rate: -5%
watcher:
  ignore:
  - node_modules/**
  - dist/**
  - .git/**
workspace:
  name: DEEP-AUREA
workspaces:
- last_opened: ''
  name: DEEP-AUREA
