agent:
  image_input_mode: text
  max_tool_steps: 50
  max_turns: 77
  personality: jarvis
  system_prompt: 'Você é o assistente técnico do projeto WBC-ZERO-G.


    Responda de forma objetiva e prática.


    Para perguntas simples:


    * responda em até 3 linhas.


    Para tarefas técnicas:


    * forneça apenas as informações necessárias para executar a tarefa.


    Evite apresentações longas, marketing, autoexplicações e textos repetitivos.


    Mantenha contexto do projeto WBC-ZERO-G quando relevante.


    Priorize:


    1. Solução

    2. Diagnóstico

    3. Próximo passo


    '
  toolset: agent
display:
  accent_theme: verde-palha
  compact: true
  language: pt-BR
  show_reasoning: true
  show_tool_calls: true
  streaming: true
logging:
  file: logs/wbc-agent.log
  format: text
  level: info
memory:
  enabled: true
  max_namespaces: 10
  reflection_enabled: false
  vector_memory_enabled: true
model:
  api_key: ollama
  base_url: http://localhost:11434/v1
  default: qwen3.5:9b
  fallback: deepseek-r1:14b
  gateway_timeout: 7200
  max_tokens: 8192
  provider: custom
  temperature: 0.3
  timeout: 300
models:
- capabilities:
  - code
  - tools
  - reasoning
  description: Best coding model — 14B params, strong code generation
  max_tokens: 16384
  name: qwen3.5:9b
  temperature: 0.2
- capabilities:
  - general
  - tools
  - creative
  description: Nemomix v1 12B — general purpose with tool-use
  max_tokens: 8192
  name: nemomix-tools:latest
  temperature: 0.4
- capabilities:
  - code
  - tools
  description: Lightweight coding — 7B params, fast inference
  max_tokens: 8192
  name: qwen2.5-coder:7b
  temperature: 0.2
- capabilities:
  - reasoning
  - analysis
  description: Deep reasoning — chain-of-thought specialist
  max_tokens: 16384
  name: deepseek-r1:14b
  temperature: 0.5
- capabilities:
  - general
  - tools
  description: General purpose — balanced speed/quality
  max_tokens: 8192
  name: qwen3.5:9b
  temperature: 0.3
security:
  allowlist_commands: false
  max_file_read_chars: 100000
  max_tool_output_bytes: 50000
  redact_secrets: true
  sandbox_enabled: false
server:
  hostname: 0.0.0.0
  port: 8000
skills:
  enabled: true
  external_dirs:
  - skills
  guard_agent_created: false
terminal:
  allowed_commands:
  - ls
  - dir
  - cat
  - type
  - echo
  - pwd
  - cd
  - mkdir
  - copy
  - move
  - del
  - git
  - npm
  - node
  - python
  - pip
  - curl
  - find
  - grep
  - rg
  - ollama
  backend: powershell
  cwd: .
  timeout: 600
watcher:
  ignore:
  - node_modules/**
  - dist/**
  - .git/**
