version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    environment:
      - SaaS_MODE=true
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
      - ./backend/config.yaml:/app/backend/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_MODE=saas
    ports:
      - '5176:80'
    depends_on:
      - backend
    restart: unless-stopped
