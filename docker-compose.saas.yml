version: '3.8'

services:
  # Backend SaaS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    environment:
      - SaaS_MODE=true
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-deep-aurea-admin}
      - TENANTS_DIR=/app/data/tenants
      - SHARED_DIR=/app/data/shared
    volumes:
      - ./data/tenants:/app/data/tenants
      - ./data/shared:/app/data/shared
      - ./backend/config.yaml:/app/config.yaml
      - ./.opencode:/app/.opencode
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend SaaS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_MODE=saas
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx Reverse Proxy + SSL
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Certbot para SSL automático
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # Redis para cache (opcional)
  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
