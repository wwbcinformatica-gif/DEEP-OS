<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>opencode - DEEP-AUREA</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
        background-color: #1e1e1e;
        color: #f0f0f0;
        min-height: 100vh;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        height: 100vh;
      }
      button:active {
        transform: scale(0.97);
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: #d97706 !important;
        outline: none !important;
      }
      button:hover,
      select:hover {
        filter: brightness(1.2);
      }
    </style>
    <script>
      // â”€â”€â”€ Apply saved accent theme BEFORE first paint â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      (function () {
        var ACCENT_MAP = {
          laranja: '#ff7a1a',
          maracuja: '#FFB74D',
          'verde-palha': '#C8E6C9',
          'azul-claro': '#D6EAF8',
          'dourado-claro': '#F9E79F',
          grafite: '#6b7280',
          dark: '#3f3f46',
        };
        var DEFAULT_KEY = 'laranja';
        var DEFAULT_HEX = '#ff7a1a';

        function lighten(r, g, b, amt) {
          return [Math.min(255, r + amt), Math.min(255, g + amt), Math.min(255, b + amt)];
        }
        function hexToRgb(hex) {
          return [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16),
          ];
        }
        function brightness(r, g, b) {
          return (r * 299 + g * 587 + b * 114) / 1000;
        }

        try {
          var raw = JSON.parse(localStorage.getItem('wbc2') || '{}');
          var themeKey = raw.accentTheme || raw.accent_theme || DEFAULT_KEY;
          var hex = ACCENT_MAP[themeKey] || DEFAULT_HEX;
          var rgb = hexToRgb(hex);
          var br = brightness(rgb[0], rgb[1], rgb[2]);
          var lighter = lighten(rgb[0], rgb[1], rgb[2], 60);

          var root = document.documentElement;
          root.style.setProperty('--accent', hex);
          root.style.setProperty('--accent-soft', 'rgba(' + rgb.join(',') + ',0.12)');
          root.style.setProperty('--accent-line', 'rgba(' + rgb.join(',') + ',0.35)');
          root.style.setProperty(
            '--accent-2',
            '#' +
              lighter
                .map(function (c) {
                  return c.toString(16).padStart(2, '0');
                })
                .join(''),
          );
          root.style.setProperty('--status-bg', hex);
          root.style.setProperty('--line-strong', 'rgba(' + rgb.join(',') + ',0.25)');
          root.style.setProperty('--status-fg', br > 160 ? '#000000' : '#ffffff');
          root.style.setProperty('--selection-fg', br > 140 ? '#000000' : '#ffffff');
        } catch (e) {
          /* localStorage indisponÃ­vel */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
