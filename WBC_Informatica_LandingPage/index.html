<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBC Informática</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>WBC Informática</h1>
        <p>Sua solução em tecnologia.</p>
    </header>
    <section class="products">
        <h2>Nossos Produtos</h2>
        <div class="product-list">
            <div class="product-card" data-product="notebook">
                <img src="images/notebook.jpg" alt="Notebook Gamer">
                <h3>Notebook Gamer</h3>
                <p>Performance top para seus jogos.</p>
                <span>R$ 5.499,00</span>
                <button class="add-cart">Adicionar ao Carrinho</button>
            </div>
            <div class="product-card" data-product="mouse">
                <img src="images/mouse.jpg" alt="Mouse sem fio">
                <h3>Mouse sem fio</h3>
                <p>Ergonomia e precisão.</p>
                <span>R$ 150,00</span>
                <button class="add-cart">Adicionar ao Carrinho</button>
            </div>
            <div class="product-card" data-product="monitor">
                <img src="images/monitor.jpg" alt="Monitor Ultra Wide">
                <h3>Monitor Ultra Wide</h3>
                <p>Imersão total.</p>
                <span>R$ 2.900,00</span>
                <button class="add-cart">Adicionar ao Carrinho</button>
            </div>
        </div>
    </section>
    <section class="cart">
        <h2>Carrinho (Simulação)</h2>
        <p>Itens adicionados: <span id="cart-count">0</span></p>
        <button>Ver Carrinho</button>
    </section>
    <footer>
        <p>&copy; 2026 WBC Informática.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
